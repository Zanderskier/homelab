x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-America/Los_Angeles}

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls372
    container_name: bazarr
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/bazarr/config:/config
      - /mnt/media-storage/movies:/movies   # must match Radarr paths exactly
      - /mnt/media-storage/tvshows:/tv      # must match Sonarr paths exactly
    ports:
      - "6767:6767"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/seerr/config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls168
    container_name: prowlarr
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:v3.5.2
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    ports:
      - "${PORT:-8191}:8191"
    volumes:
      - /var/lib/flaresolver:/config
    tmpfs:
      - /tmp:size=256M,mode=1777
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    environment:
      <<: *common-env
      UMASK: "022"
    volumes:
      - /mnt/media-storage/arr-stack/radarr/config:/config
      - /mnt/media-storage/downloads:/data
      - /mnt/media-storage/movies:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped

  requestrr:
    image: lscr.io/linuxserver/requestrr:V2.1.2-ls44
    container_name: requestrr
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/requestrr/config:/config
    ports:
      - "4545:4545"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls281
    container_name: sabnzbd
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/sabnzbd/config:/config
      - /mnt/media-storage/downloads/usenet/incomplete:/incomplete-downloads
      - /mnt/media-storage/downloads/usenet/complete:/downloads
      - /mnt/media-storage:/media
    ports:
      - "8080:8080"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    environment: *common-env
    volumes:
      - /mnt/media-storage/arr-stack/sonarr/config:/config
      - /mnt/media-storage/tvshows:/tv
      - /mnt/media-storage/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
