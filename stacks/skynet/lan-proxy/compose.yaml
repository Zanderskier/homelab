# Traefik: the LAN entry point for names Pi-hole points here (split DNS). Runs on lan-proxy (CT 111).
# Outside traffic never comes here; it uses the Cloudflare tunnel. Routes: configs.routes below.
# Certificate: wildcard *.failsafe.work from Let's Encrypt, DNS-01 through Cloudflare (no open ports).
services:
  traefik:
    image: docker.io/library/traefik:v3.7.19   # Renovate keeps this current
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"                                  # only redirects to 443
      - "443:443"
    environment:
      TZ: America/Los_Angeles
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in the Portainer stack variables}
    command:
      # Entry points: where Traefik listens
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # One wildcard certificate for every route on websecure
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=failsafe.work
      - --entrypoints.websecure.http.tls.domains[0].sans=*.failsafe.work
      # How to get it: Let's Encrypt, proving ownership with a DNS record via Cloudflare
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53
      # FIRST RUN ONLY: Let's Encrypt's test server (generous limits). Delete this line once it works.
      - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      # Routes come from the file below
      - --providers.file.filename=/etc/traefik/routes.yml
      - --log.level=INFO
    volumes:
      - /srv/lan-proxy/certs:/certs              # the certificate lives here (in the CT disk, so PBS backs it up)
    configs:
      - source: routes
        target: /etc/traefik/routes.yml

configs:
  routes:
    content: |
      http:
        routers:
          wiki:
            rule: Host(`wiki.failsafe.work`)
            entryPoints: [websecure]
            service: authentik         # Authentik's outpost picks the app by hostname
          authentik:
            rule: Host(`authentik.failsafe.work`)   # the login pages themselves
            entryPoints: [websecure]
            service: authentik
        services:
          authentik:
            loadBalancer:
              servers:
                - url: http://192.168.50.151:9000         # where Authentik listens on the LAN