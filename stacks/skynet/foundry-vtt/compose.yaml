# All container options: https://github.com/felddy/foundryvtt-docker#environment-variables
services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:release
    container_name: foundry
    hostname: failsafe-dnd
    volumes:
      - /mnt/nvme0/Foundry_Data:/data
    environment:
      FOUNDRY_USERNAME: ${FOUNDRY_USERNAME:-}
      FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD:-}
      FOUNDRY_ADMIN_KEY: ${FOUNDRY_ADMIN_KEY:-}
      FOUNDRY_TELEMETRY: "false"
    ports:
      - "30000:30000"
    restart: unless-stopped

  ddb-proxy:
    image: ghcr.io/mrprimate/ddb-proxy:latest
    container_name: ddb-proxy
    ports:
      - "3000:3000"
    restart: unless-stopped
