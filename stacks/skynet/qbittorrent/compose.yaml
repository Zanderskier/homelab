services:
  pia-qbittorrent:
      image: docker.io/j4ym0/pia-qbittorrent:5.2.4-ubuntu
      container_name: pia-qbittorrent
      cap_add:
          - NET_ADMIN
      environment:
          - REGION=${PIA_REGION:-CA_Vancouver}
          - USER=${PIA_USER}
          - PASSWORD=${PIA_PASSWORD}
          - PORT_FORWARDING=true
          - UID=1000
          - GID=1001
          - UMASK=002
      volumes:
          - /mnt/media-storage/arr-stack/qbittorrent/qBittorrent/config:/config
          - /mnt/media-storage:/downloads
      ports:
          - "8888:8888"
      restart: always

  # Sidecar: the private tracker lets a seedbox register its current IP through an HTTP endpoint.
  # This keeps that registration in sync with the VPN's exit IP, which changes. It shares
  # pia-qbittorrent's network namespace, so its requests leave through the VPN tunnel.
  # The endpoint and session cookie are Portainer variables, not part of this repo.
  seedbox-ip-sync:
      image: docker.io/curlimages/curl:8.23.0
      container_name: seedbox-ip-sync
      network_mode: "service:pia-qbittorrent"
      depends_on:
          - pia-qbittorrent
      user: "0:0"
      environment:
          - SYNC_URL=${SEEDBOX_SYNC_URL:?Set SEEDBOX_SYNC_URL in Portainer}
          - SESSION_COOKIE=${SEEDBOX_SESSION_COOKIE}
          - INTERVAL=${SEEDBOX_SYNC_INTERVAL:-3600}
      volumes:
          - /mnt/media-storage/arr-stack/qbittorrent/seedbox:/data
      restart: unless-stopped
      entrypoint: ["/bin/sh", "-c"]
      command:
          - |
            # Logs go to stderr so they never mix into captured curl output.
            log() { echo "$$(date '+%Y-%m-%d %H:%M:%S') $$*" >&2; }
            JAR=/data/session.cookies

            # Accept the bare token as well as mam_id=<token>. Without an "=", curl -b treats the
            # value as a file name, sends no cookie, and the tracker answers "No Session Cookie".
            COOKIE=$$(printf '%s' "$$SESSION_COOKIE" | tr -d ' \r\n"')
            case "$$COOKIE" in
              ""|*=*) ;;
              *) COOKIE="mam_id=$$COOKIE" ;;
            esac

            # A saved jar only counts if it actually holds a mam_id cookie.
            has_saved() { [ -s "$$JAR" ] && grep -q 'mam_id' "$$JAR"; }

            if [ -z "$$COOKIE" ] && ! has_saved; then
              log "ERROR: SEEDBOX_SESSION_COOKIE is not set and no saved cookie exists in $$JAR"
              exit 1
            fi

            # curl -c saves any cookie the tracker sends back in $$JAR (as the tracker's own example
            # does), and later calls reuse it. call env|saved sets BODY, CODE and MSG and returns
            # curl's exit code.
            call() {
              if [ "$$1" = "env" ]; then b="$$COOKIE"; else b="$$JAR"; fi
              out=$$(curl -sS -m 30 -c "$$JAR" -b "$$b" -w '\n%{http_code}' "$$SYNC_URL") || return $$?
              CODE=$$(printf '%s\n' "$$out" | tail -n 1)
              BODY=$$(printf '%s\n' "$$out" | sed '$$d')
              MSG=$$(printf '%s' "$$BODY" | sed -n 's/.*"msg": *"\([^"]*\)".*/\1/p')
              [ -n "$$MSG" ] || MSG="no JSON msg (HTTP $$CODE): $$(printf '%s' "$$BODY" | head -c 200)"
            }
            ok() { printf '%s' "$$BODY" | grep -q '"Success": *true'; }

            log "Waiting 30s for VPN to come up..."
            sleep 30
            fails=0
            while true; do
              if [ -n "$$COOKIE" ] && ! has_saved; then src=env; else src=saved; fi
              call "$$src"; rc=$$?
              # Any rejection of the saved cookie except the hourly rate limit: fall back to the variable.
              if [ $$rc -eq 0 ] && [ "$$src" = saved ] && ! ok && [ "$$CODE" != 429 ] && [ -n "$$COOKIE" ]; then
                log "Saved cookie rejected ($$MSG); retrying with SEEDBOX_SESSION_COOKIE"
                rm -f "$$JAR"
                src=env
                call env; rc=$$?
              fi
              if [ $$rc -ne 0 ]; then
                fails=$$((fails + 1))
                log "curl failed (rc=$$rc, $$fails/3)"
                if [ $$fails -ge 3 ]; then
                  log "Network unreachable; exiting so Docker restarts and rejoins the VPN namespace"
                  exit 1
                fi
                sleep 60
                continue
              fi
              fails=0
              if ok; then
                log "OK ($$src cookie): $$BODY"
              elif [ "$$CODE" = 429 ]; then
                log "Rate limited (one IP change per hour, account-wide); will retry: $$BODY"
              else
                case "$$MSG" in
                  *"No Session Cookie"*) hint="SEEDBOX_SESSION_COOKIE is empty or not a valid mam_id value" ;;
                  *"ASN mismatch"*) hint="the VPN moved to a new ASN: in the tracker's Manage Session, add an ASN via the IP above" ;;
                  *"IP mismatch"*) hint="the session is IP-locked: recreate it as ASN-locked" ;;
                  *"Incorrect session type"*) hint="recreate the session with 'Allow session to set dynamic seedbox' = Yes" ;;
                  *) hint="create a new ASN-locked session for the IP above and update SEEDBOX_SESSION_COOKIE" ;;
                esac
                log "ERROR ($$src cookie, HTTP $$CODE): $$BODY"
                log "Fix: $$hint"
              fi
              sleep "$$INTERVAL"
            done
