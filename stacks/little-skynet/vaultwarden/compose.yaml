# The old compose file never passed its .env to the container, so ADMIN_TOKEN, SMTP_* and SSO_*
# were NOT applied unless set through /admin. env_file below now applies them. Before deploying,
# read docs/migration.md (SSO_ONLY=true would lock out the break-glass account if Authentik is down).
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    volumes:
      - /main/vaultwarden:/data/
    ports:
      - "8123:80"
    env_file:
      - stack.env
    restart: unless-stopped
