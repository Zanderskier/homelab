services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    ports:
      - "4000:3000"
    volumes:
      - /main/homepage/config:/app/config
      # docker.sock removed: config/docker.yaml defines no Docker hosts, and a socket mount
      # (even :ro) is full control of the Docker host. If Docker widgets are wanted later,
      # add a docker-socket-proxy service instead of mounting the socket.
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-192.168.50.81:4000,192.168.50.81}
      TZ: ${TZ:-America/Los_Angeles}
      # Widget secrets: config/*.yaml reference these as {{HOMEPAGE_VAR_*}}. Set them as Portainer
      # stack variables (list + where to get each: .env.example). Empty = that widget shows an error.
      HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY: ${HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY:-}
      HOMEPAGE_VAR_AUTHENTIK_KEY: ${HOMEPAGE_VAR_AUTHENTIK_KEY:-}
      HOMEPAGE_VAR_BAZARR_KEY: ${HOMEPAGE_VAR_BAZARR_KEY:-}
      HOMEPAGE_VAR_FILEBROWSER_PASS: ${HOMEPAGE_VAR_FILEBROWSER_PASS:-}
      HOMEPAGE_VAR_FILEBROWSER_USER: ${HOMEPAGE_VAR_FILEBROWSER_USER:-}
      HOMEPAGE_VAR_GITEA_KEY: ${HOMEPAGE_VAR_GITEA_KEY:-}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_VAR_IMMICH_KEY:-}
      HOMEPAGE_VAR_MEALIE_KEY: ${HOMEPAGE_VAR_MEALIE_KEY:-}
      HOMEPAGE_VAR_PAPERLESS_KEY: ${HOMEPAGE_VAR_PAPERLESS_KEY:-}
      HOMEPAGE_VAR_PBS_PASS: ${HOMEPAGE_VAR_PBS_PASS:-}
      HOMEPAGE_VAR_PBS_USER: ${HOMEPAGE_VAR_PBS_USER:-}
      HOMEPAGE_VAR_PIHOLE_KEY: ${HOMEPAGE_VAR_PIHOLE_KEY:-}
      HOMEPAGE_VAR_PLEX_KEY: ${HOMEPAGE_VAR_PLEX_KEY:-}
      HOMEPAGE_VAR_PORTAINER_KEY: ${HOMEPAGE_VAR_PORTAINER_KEY:-}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY:-}
      HOMEPAGE_VAR_PVE_LSKY_PASS: ${HOMEPAGE_VAR_PVE_LSKY_PASS:-}
      HOMEPAGE_VAR_PVE_LSKY_USER: ${HOMEPAGE_VAR_PVE_LSKY_USER:-}
      HOMEPAGE_VAR_PVE_SKYNET_PASS: ${HOMEPAGE_VAR_PVE_SKYNET_PASS:-}
      HOMEPAGE_VAR_PVE_SKYNET_USER: ${HOMEPAGE_VAR_PVE_SKYNET_USER:-}
      HOMEPAGE_VAR_QBITTORRENT_KEY: ${HOMEPAGE_VAR_QBITTORRENT_KEY:-}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY:-}
      HOMEPAGE_VAR_SABNZBD_KEY: ${HOMEPAGE_VAR_SABNZBD_KEY:-}
      HOMEPAGE_VAR_SEERR_KEY: ${HOMEPAGE_VAR_SEERR_KEY:-}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY:-}
      HOMEPAGE_VAR_TAILSCALE_KEY: ${HOMEPAGE_VAR_TAILSCALE_KEY:-}
      HOMEPAGE_VAR_TAUTULLI_KEY: ${HOMEPAGE_VAR_TAUTULLI_KEY:-}
    restart: unless-stopped
