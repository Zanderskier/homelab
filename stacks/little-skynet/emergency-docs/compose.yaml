# Web server for the family emergency guide. Portainer Git stack on the Portainer LXC
# (little-skynet, next to Vaultwarden: if the vault is up, so is the guide).
#
# What it serves and how are files on the host, kept there by ansible/playbooks/emergency-docs.yml:
#   /opt/emergency-docs/nginx/   default.conf (Authentik login on :8080, LAN fallback on :8081)
#                                and htpasswd (the LAN fallback's password, only when it's on)
#   /srv/emergency-docs/site/    the built site, copied in by the private emergency-docs repo
# Run that playbook BEFORE creating this stack, or Docker creates those folders empty. After a
# config change the playbook tests it and reloads nginx; this stack doesn't need redeploying.
services:
  emergency-docs:
    image: docker.io/library/nginx:1.30.7-alpine
    container_name: emergency-docs
    ports:
      - "8090:8080"   # through the Cloudflare tunnel, Authentik login required
      - "8091:8081"   # LAN fallback with a password; answers only once it's turned on
    volumes:
      - /opt/emergency-docs/nginx:/etc/nginx/conf.d:ro
      - /srv/emergency-docs/site:/usr/share/nginx/html:ro
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    restart: unless-stopped
