services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.19.1-ls252
    container_name: tautulli
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - /main/tautulli/config:/config
    ports:
      - "8181:8181"
    restart: unless-stopped
