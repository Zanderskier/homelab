---
# Installs a nightly backup, on a Proxmox host, of folders that Proxmox's own backups skip.
#
# Proxmox backs up each container's own disk but never its bind mounts (the mpX: /mnt/... lines),
# so data kept on a host drive and mounted into containers (e.g. Gitea on /mnt/nvme1) is in no
# backup. This sends those folders to Proxmox Backup Server every night, as a "host" backup:
#   /usr/local/sbin/kiwix-update     the script (checks drives, dumps databases, runs the backup)
#   /etc/kiwix-update.env            PBS address + token, root only
#   kiwix-update.service + .timer    runs it nightly at kiwix_update_time
# What to back up: inventory/host_vars/<host>.yml. PBS details: group_vars/all.yml.
# Token secret: pbs_kiwix_update_secret in /ansible_config/secrets.yml.
#
# extra_vars kiwix_update_run_now=true also runs one backup at the end and shows its log.
# Check mode shows each file change and runs nothing.
- name: Host folder backups to Proxmox Backup Server
  hosts: survival
  become: true
  gather_facts: false
  tasks:
    - name: Skip hosts with nothing listed to back up
      when: kiwix_update_paths is not defined

    - name: Check the settings are filled in
      ansible.builtin.assert:
        that:
          - pbs_datastore != 'CHANGE_ME'
          - pbs_fingerprint is match('^([0-9a-fA-F]{2}:){31}[0-9a-fA-F]{2}$')
          - pbs_kiwix_update_secret is defined and pbs_kiwix_update_secret | length > 0
        fail_msg: >-
          Set pbs_datastore and pbs_fingerprint in inventory/group_vars/all.yml, and
          pbs_kiwix_update_secret in /ansible_config/secrets.yml on the Ansible LXC (see ansible/README.md).
        quiet: true

    - name: Check proxmox-backup-client is installed (it comes with Proxmox VE)
      ansible.builtin.command: proxmox-backup-client version
      changed_when: false
      check_mode: false

    # The script uses --change-detection-mode (skip unchanged files). Older clients don't have it.
    - name: Check proxmox-backup-client can skip unchanged files (needs version 3.3 or newer)
      ansible.builtin.command: proxmox-backup-client help backup
      register: pbc_help
      changed_when: false
      check_mode: false
      failed_when: "'change-detection-mode' not in (pbc_help.stdout + pbc_help.stderr)"

    - name: Install the settings file (root only, holds the token secret)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kiwix-update/kiwix-update.env.j2"
        dest: /etc/kiwix-update.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install the backup script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kiwix-update/kiwix-update.sh.j2"
        dest: /usr/local/sbin/kiwix-update
        owner: root
        group: root
        mode: "0750"

    - name: Install the systemd service and timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kiwix-update/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [kiwix-update.service, kiwix-update.timer]

    # In check mode the unit files above aren't really written, so systemd couldn't find the timer.
    - name: Turn on the nightly timer
      ansible.builtin.systemd_service:
        name: kiwix-update.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Explain what check mode left out
      ansible.builtin.debug:
        msg: A real run turns on kiwix-update.timer here (nightly at {{ kiwix_update_time }}).
      when: ansible_check_mode

    - name: When it runs next
      # The systemd module can start units but not list timers.
      ansible.builtin.command: systemctl list-timers kiwix-update.timer --no-pager  # noqa: command-instead-of-module
      register: next_run
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Schedule
      ansible.builtin.debug:
        msg: "{{ next_run.stdout_lines }}"

    - name: Run one backup now
      when:
        - kiwix_update_run_now | default(false) | bool
        - not ansible_check_mode
      block:
        - name: Note the time, so only this run's log is shown
          ansible.builtin.command: date +%s
          register: run_started
          changed_when: false

        - name: Back up now (waits until it's finished)
          # A plain command, not the systemd module: a failed backup must not stop the play before its log is shown.
          ansible.builtin.command: systemctl start kiwix-update.service  # noqa: command-instead-of-module
          changed_when: true
          failed_when: false
          register: run_now

        - name: Read its log
          ansible.builtin.command: journalctl -u kiwix-update.service --since "@{{ run_started.stdout }}" --no-pager -o cat
          register: run_log
          changed_when: false

        - name: Its log
          ansible.builtin.debug:
            msg: "{{ run_log.stdout_lines[-40:] }}"

        - name: Fail if the backup failed
          ansible.builtin.assert:
            that: run_now.rc == 0
            fail_msg: The backup failed. The log above says which step and why.
            quiet: true

    - name: Apt packages installed curl & wget
          ansible.builtin.apt:
            name:
              - curl
              - get
            state: present
            update_cache: true
          

