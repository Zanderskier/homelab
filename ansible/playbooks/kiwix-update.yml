---
# Keeps the Kiwix ZIM files on the survival LXC at their newest versions, by installing:
#   /usr/local/sbin/kiwix-update       the script: find newest, download (resumes), checksum,
#                                      size check, old version to archive/, restart Kiwix
#   kiwix-update.service + .timer      runs it monthly at kiwix_update_time
# Which ZIMs and where: inventory/host_vars/survival.yml. Nothing is ever deleted.
#
# The download itself runs on the LXC, not in this job: Wikipedia is 119 GB and can take hours.
# extra_vars kiwix_update_run_now=true starts one run in the background and says how to follow it.
# Check mode shows each file change and runs nothing.
- name: Kiwix ZIM updates
  hosts: survival
  become: true
  gather_facts: false
  tasks:
    - name: Tools the script uses
      ansible.builtin.apt:
        name:
          - curl
          - wget
        state: present
        update_cache: true
        cache_valid_time: 3600   # don't refresh the package lists again if they're less than an hour old

    - name: Install the update script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kiwix-update/kiwix-update.sh.j2"
        dest: /usr/local/sbin/kiwix-update
        owner: root
        group: root
        mode: "0750"

    - name: Install the systemd service and timer
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kiwix-update/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [kiwix-update.service, kiwix-update.timer]

    # In check mode the unit files above aren't really written, so systemd couldn't find the timer.
    - name: Turn on the monthly timer
      ansible.builtin.systemd_service:
        name: kiwix-update.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Explain what check mode left out
      ansible.builtin.debug:
        msg: A real run turns on kiwix-update.timer here (at {{ kiwix_update_time }}).
      when: ansible_check_mode

    - name: When it runs next
      # The systemd module can start units but not list timers.
      ansible.builtin.command: systemctl list-timers kiwix-update.timer --no-pager  # noqa: command-instead-of-module
      register: next_run
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Schedule
      ansible.builtin.debug:
        msg: "{{ next_run.stdout_lines }}"

    - name: Run one update now
      when:
        - kiwix_update_run_now | default(false) | bool
        - not ansible_check_mode
      block:
        # --no-block: start it and return at once. Without it, this job would wait for the whole
        # download (hours) and be killed by the Actions time limit.
        - name: Start an update in the background
          ansible.builtin.command: systemctl start --no-block kiwix-update.service  # noqa: command-instead-of-module
          changed_when: true

        - name: How to follow it
          ansible.builtin.debug:
            msg:
              - The update is running on {{ inventory_hostname }}. It can take hours for Wikipedia.
              - "Follow it live:     ssh alex@{{ ansible_host }}, then: sudo journalctl -fu kiwix-update"
              - "Is it still going:  systemctl status kiwix-update"
              - "It ends with RESULT: OK, or RESULT: FAILED or HELD and the reason above it."
