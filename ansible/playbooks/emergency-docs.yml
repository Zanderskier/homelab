---
# Host side of the family emergency guide, on the Portainer LXC (little-skynet). The nginx
# container itself is a Portainer Git stack (stacks/little-skynet/emergency-docs/compose.yaml);
# this playbook keeps everything on the host that the container reads:
#
#   docs-deploy user   the private emergency-docs repo's workflow copies the built site in as this
#                      user. Its key (files/emergency-docs-deploy.pub) only runs rrsync, which can
#                      only write into emergency_docs_site_dir, and only from the Docker runner's IP.
#   default.conf       nginx config: :8080 (tunnel) needs an Authentik login, :8081 (LAN fallback)
#                      a password, only when emergency_docs_lan_htpasswd is in secrets.yml
#   htpasswd           that password (hashed)
#
# Run it BEFORE creating the Portainer stack (the stack mounts these folders). After a config
# change it tests the new config inside the running container, then reloads nginx: no redeploy.
# Settings: inventory/host_vars/portainer.yml. Check mode shows every file change and runs nothing.
- name: Emergency docs (host side)
  hosts: portainer
  become: true
  gather_facts: false
  vars:
    deploy_user: docs-deploy
    container: emergency-docs        # container_name in the stack's compose.yaml
    lan_enabled: "{{ emergency_docs_lan_htpasswd is defined }}"
  tasks:
    - name: Check the LAN password line looks like an htpasswd entry (user:hash)
      ansible.builtin.assert:
        that: emergency_docs_lan_htpasswd is match('^[A-Za-z0-9._-]+:\$(apr1|2y|2b)\$')
        fail_msg: >-
          emergency_docs_lan_htpasswd in secrets.yml should be one line, "username:hash", made with
          `printf 'USERNAME:%s\n' "$(openssl passwd -apr1)"` (see ansible/README.md).
        quiet: true
      when: lan_enabled | bool
      no_log: true

    - name: Install rsync (rrsync, the restricted receiver, comes with it)
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Debian 12+ ships it as /usr/bin/rrsync (a Python script). Older releases only had an
    # example copy under /usr/share/doc, which isn't runnable as-is.
    - name: Find rrsync
      ansible.builtin.command: sh -c 'command -v rrsync'
      register: rrsync_path
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Stop if there's no rrsync
      ansible.builtin.assert:
        # In a dry run rsync may not be installed yet (the install above only says it would).
        that: rrsync_path.rc == 0 or ansible_check_mode
        fail_msg: rsync is installed but has no rrsync (needs Debian 12 or newer). Upgrade the LXC first.
        quiet: true

    # A dry run of the very first setup can't preview the steps that write into the deploy user's
    # home or the new folders: neither exists yet, because a dry run creates nothing. Those steps
    # are skipped then, with a note. Real runs, and dry runs once it's set up, run everything.
    - name: Does the deploy user exist yet?
      ansible.builtin.command: getent passwd {{ deploy_user }}
      register: deploy_user_lookup
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Remember whether this is a dry run of the very first setup
      ansible.builtin.set_fact:
        first_setup_dry_run: "{{ ansible_check_mode and deploy_user_lookup.rc != 0 }}"

    - name: Create the deploy user (no password; only its key can log in)
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        comment: Emergency docs deploy (rrsync only)
        shell: /bin/sh
        password: "*"
        create_home: true
        system: true

    - name: Folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ emergency_docs_conf_dir | dirname }}", owner: root, mode: "0755" }
        - { path: "{{ emergency_docs_conf_dir }}", owner: root, mode: "0755" }
        - { path: "{{ emergency_docs_site_dir | dirname }}", owner: root, mode: "0755" }
        - { path: "{{ emergency_docs_site_dir }}", owner: "{{ deploy_user }}", mode: "0755" }

    - name: Authorize the deploy key (rrsync into the site folder, from the runner only)
      vars:
        rrsync_bin: "{{ rrsync_path.stdout_lines | first | default('/usr/bin/rrsync') }}"
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/emergency-docs-deploy.pub') }}"
        key_options: 'from="{{ emergency_docs_deploy_from }}",restrict,command="{{ rrsync_bin }} {{ emergency_docs_site_dir }}"'
        exclusive: true
      when: not (first_setup_dry_run | bool)

    - name: Placeholder page until the first deploy (never overwrites the real site)
      ansible.builtin.copy:
        dest: "{{ emergency_docs_site_dir }}/index.html"
        content: |
          <!doctype html><meta charset="utf-8"><title>Not published yet</title>
          <p>The emergency guide hasn't been published here yet. Run the deploy workflow in the
          emergency-docs repo.</p>
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        force: false
      when: not (first_setup_dry_run | bool)

    - name: LAN password file (readable by nginx's user only)
      ansible.builtin.copy:
        dest: "{{ emergency_docs_conf_dir }}/htpasswd"
        content: "{{ emergency_docs_lan_htpasswd }}\n"
        owner: root
        group: "101"        # nginx's user inside the container
        mode: "0640"
      when: (lan_enabled | bool) and not (first_setup_dry_run | bool)
      no_log: true
      notify: [Test nginx config, Reload nginx]

    - name: Remove the LAN password file when the fallback is off
      ansible.builtin.file:
        path: "{{ emergency_docs_conf_dir }}/htpasswd"
        state: absent
      when: not (lan_enabled | bool)
      notify: [Test nginx config, Reload nginx]

    - name: Install the nginx config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/emergency-docs/default.conf.j2"
        dest: "{{ emergency_docs_conf_dir }}/default.conf"
        owner: root
        group: root
        mode: "0644"
      when: not (first_setup_dry_run | bool)
      notify: [Test nginx config, Reload nginx]

    - name: First setup, dry run - what couldn't be previewed
      ansible.builtin.debug:
        msg: >-
          The deploy user and folders don't exist yet, so this dry run skipped: authorizing the
          deploy key, the placeholder page, {{ 'the LAN password file, ' if lan_enabled | bool else '' }}and
          the nginx config. A real run does them. After it, dry runs show everything.
      when: first_setup_dry_run | bool

    - name: Is the Portainer stack's container running?
      ansible.builtin.command: docker inspect -f {% raw %}'{{.State.Running}}'{% endraw %} {{ container }}
      register: container_state
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Remember the answer
      ansible.builtin.set_fact:
        container_running: "{{ container_state.rc == 0 and container_state.stdout == 'true' }}"

  handlers:
    # The config folder is mounted into the container, so it already sees the new files. Test them
    # first: a broken config fails the run here and nginx keeps serving the old one, but only until
    # the container restarts. Fix the template and run again before then.
    - name: Test nginx config
      ansible.builtin.command: docker exec {{ container }} nginx -t
      changed_when: false
      when: container_running | bool

    - name: Reload nginx
      ansible.builtin.command: docker exec {{ container }} nginx -s reload
      changed_when: true
      when: container_running | bool

  post_tasks:
    - name: Without a login, the tunnel port must send the browser to Authentik
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ emergency_docs_port }}/"
        follow_redirects: none
        status_code: 302
      register: tunnel_check
      retries: 5
      delay: 3
      until: tunnel_check.status == 302
      when: container_running | bool

    - name: Without a password, the LAN port must refuse (401)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ emergency_docs_lan_port }}/"
        status_code: 401
      when: (container_running | bool) and (lan_enabled | bool)

    - name: Next steps
      vars:
        lan_note: >-
          {{ 'port ' ~ emergency_docs_lan_port ~ ' requires the LAN password' if lan_enabled | bool
          else 'the LAN fallback is off (no emergency_docs_lan_htpasswd)' }}
        stack_note: >-
          {{ 'Checked: port ' ~ emergency_docs_port ~ ' requires Authentik, ' ~ lan_note ~ '.' if container_running | bool
          else 'The host side is ready. Now create the Portainer stack: stacks/little-skynet/emergency-docs/compose.yaml.' }}
      ansible.builtin.debug:
        msg:
          - "{{ stack_note }}"
          - "If you haven't yet: Authentik proxy provider + application, the tunnel route, then run the emergency-docs repo's deploy workflow."
