[defaults]
inventory = inventory/hosts.yml
remote_user = ansible
interpreter_python = auto_silent
host_key_checking = True
forks = 5
retry_files_enabled = False
callback_result_format = yaml
# Don't print tasks that were skipped: the output then shows only what was checked or changed.
display_skipped_hosts = False

[ssh_connection]
# known_hosts is committed to the repo (host public keys aren't secret), so CI verifies every host
# instead of trusting whatever answers on that IP.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
