---
# Variables for the Portainer server and every agent host (ansible/playbooks/portainer.yml).

# ONE version for the server and all agents: Portainer asks for them to match. Renovate opens a PR
# to change this (2.45.x patches only, see renovate.json); it is never auto-merged. To move to a
# newer LTS line, change renovate.json's allowedVersions and this value together.
# renovate: datasource=docker depName=portainer/portainer-ce
portainer_version: "2.45.3"

# Where the server answers. The playbook's API calls and its version checks use this.
portainer_url: https://192.168.50.81:9443

# Config folders on each host's own disk (so PBS backs them up). /root/portainer links to them.
portainer_server_dir: /opt/portainer
portainer_agent_dir: /opt/portainer-agent

# The server's EXISTING data volume, by its real name. It is called root_... because the first
# compose file lived in /root. The playbook never creates this volume: if it's missing, it stops
# instead of starting an empty Portainer.
portainer_data_volume: root_portainer_data

# Copies of the server's data taken before every (re)deploy, in <server dir>/backups.
portainer_backups_to_keep: 5

# The standard agent's port. The server connects to tcp://<host>:9001.
portainer_agent_port: 9001

# Optional. Define portainer_agent_secret in /ansible_config/secrets.yml to make the server and all
# agents share a secret (AGENT_SECRET), so an agent only obeys a server that knows it. Not set today.
