---
# Variables every host gets. A run can override them, e.g. -e allow_reboot=true.

# Never reboot unless a run explicitly asks for it.
allow_reboot: false

# Where the break-glass account may log in with a password (harden-ssh.yml). Everything else is
# key-only. 10.8.0.0/24 is the ASUS OpenVPN server's default client subnet: check yours under
# VPN > OpenVPN on the router.
breakglass_allowed_from:
  - 192.168.50.0/24
  - 10.8.0.0/24

# Proxmox Backup Server, for backups that don't go through Proxmox (playbooks/host-backup.yml).
pbs_server: 192.168.50.76
pbs_datastore: pbs-external-wd     # PBS UI > Datastore > its name (the 4 TB WD USB drive)
pbs_namespace: hosts               # keeps these apart from the container backups
# PBS UI > Dashboard > Show Fingerprint (not secret; lets clients check they reach the real PBS)
pbs_fingerprint: "72:5b:79:f9:4a:14:b0:67:9f:ce:4f:02:0c:c5:87:0b:b6:11:18:fd:7f:8c:eb:7e:8e:07:8e:04:9f:c4:f9:a9"
pbs_host_backup_token: "host-backup@pbs!skynet" # the token's secret is pbs_host_backup_secret in secrets.yml
# Nightly host backups only read files that changed. On this day of the week (1 = Monday,
# 7 = Sunday) every file is read again, to catch a change that kept the same size and mtime.
host_backup_full_read_day: 7

# Host config, backed up by host-backup along with the drives. These aren't drives, so there's no
# mount check. Archive names must be unique and different from the drive names in host_vars.
# Contains secrets (/etc/pve/priv, /etc/host-backup.env, /root/.smbcredentials): any off-site copy
# of these archives must be encrypted.
host_backup_config_paths:
  - name: etc           # archive etc.pxar: fstab, smb.conf, network, logrotate, apt sources...
    path: /etc
  - name: pve           # /etc/pve is a separate filesystem (pmxcfs); the /etc archive stops at it.
    path: /etc/pve      # Every guest's config, storage.cfg, backup jobs, users.
  - name: root          # scripts kept in /root (e.g. rsync-data.sh on little-skynet)
    path: /root
  - name: crontabs      # root's crontab (on little-skynet it runs rsync-data.sh)
    path: /var/spool/cron/crontabs

# Every machine's timezone (playbooks/timezone.yml). Local schedules (the host-backup timer,
# Proxmox backup jobs, cron) run in this time on every host.
timezone: America/Los_Angeles
