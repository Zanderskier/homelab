---
# Host data backup (playbooks/host-backup.yml): folders that Proxmox's own backups don't cover.
# Proxmox backs up each container's own disk, but never its bind mounts (mpX: /mnt/... lines), so
# these folders are sent to PBS separately, every night at host_backup_time.
host_backup_paths:
  - name: immich            # archive name in PBS: immich.mpxar
    path: /mnt/second-drive      # immich data backup
    exclude:
      - /immich/postgres     # live database files; restore from immich/library/backups instead


host_backup_id: little-skynet             # shows in PBS as host/little-skynet
host_backup_time: "02:45"          # Pacific; before the 03:00 Proxmox backups
