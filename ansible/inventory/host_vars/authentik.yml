---
# Emergency docs (playbooks/emergency-docs.yml): the family emergency guide. It needs an Authentik
# login, so it runs here, next to Authentik. The nginx container is a Portainer Git stack
# (stacks/skynet/emergency-docs/compose.yaml, deployed to this LXC's environment); the playbook
# keeps the host side it reads: its config and the site folder. The content lives in a separate
# PRIVATE repo, whose workflow copies the built site in over SSH as docs-deploy (rrsync: that user
# can only write into emergency_docs_site_dir, and only from the Docker runner's IP).

# Must match the volumes in the stack's compose.yaml.
emergency_docs_conf_dir: /opt/emergency-docs/nginx     # default.conf -> /etc/nginx/conf.d
emergency_docs_site_dir: /srv/emergency-docs/site      # -> /usr/share/nginx/html

# Must match the host port in the stack's compose.yaml (used for the check at the end).
emergency_docs_port: 8090       # the digital-estate Cloudflare tunnel points here

# The public hostname (the tunnel's route, and the Authentik provider's external host).
# The check at the end asks for it, so it matches the right Authentik application.
emergency_docs_hostname: digital-estate.failsafe.work

emergency_docs_deploy_from: 192.168.50.90        # gitea-runner LXC: the only address the key works from

# Authentik's embedded outpost (on this same LXC), which answers nginx's "is this request logged
# in?" checks. The LXC's own address, because nginx and Authentik are separate compose stacks.
authentik_outpost_url: http://192.168.50.151:9000
