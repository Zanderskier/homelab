---
# Emergency docs (playbooks/emergency-docs.yml): the family emergency guide. The nginx container
# is a Portainer Git stack (stacks/little-skynet/emergency-docs/compose.yaml); this playbook keeps
# the host side it reads: its config, the LAN password and the site folder. The content lives in a
# separate PRIVATE repo, whose workflow copies the built site in over SSH as docs-deploy (rrsync:
# that user can only write into emergency_docs_site_dir, and only from the Docker runner's IP).

# Must match the volumes in the stack's compose.yaml.
emergency_docs_conf_dir: /opt/emergency-docs/nginx     # default.conf + htpasswd -> /etc/nginx/conf.d
emergency_docs_site_dir: /srv/emergency-docs/site      # -> /usr/share/nginx/html

# Must match the host ports in the stack's compose.yaml (used for the checks at the end).
emergency_docs_port: 8090       # tunnel -> Authentik login
emergency_docs_lan_port: 8091   # LAN fallback, only when emergency_docs_lan_htpasswd is in secrets.yml

emergency_docs_deploy_from: 192.168.50.90        # gitea-runner LXC: the only address the key works from

# Authentik's embedded outpost, which answers nginx's "is this request logged in?" checks.
authentik_outpost_url: http://192.168.50.151:9000
