---
# CT 109 on skynet: the Gitea Actions runner. It runs Docker-in-Docker, so job images are stored
# in an inner Docker daemon inside this container, not in the host's Docker.
# docker-cleanup.yml prunes that inner daemon too when this is set.
docker_inner_daemon: gitea-runner-1   # container_name in stacks/skynet/gitea-runner/compose.yaml
