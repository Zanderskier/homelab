---
# Host data backup (playbooks/host-backup.yml): folders that Proxmox's own backups don't cover.
# Proxmox backs up each container's own disk, but never its bind mounts (mpX: /mnt/... lines), so
# these folders are sent to PBS separately, every night at host_backup_time.
# Each entry: name (archive name in PBS), path (must be a mounted drive), and optionally exclude:
# paths inside it to skip, written from that drive's top and starting with /, e.g. /immich/postgres.
host_backup_paths:
  - name: nvme1            # archive name in PBS: nvme1.mpxar
    path: /mnt/nvme1       # Gitea (CT 107), Authentik (CT 108), gitea-runner (CT 109)
  
  - name: nvme0            # archive name in PBS: nvme0.mpxar
    path: /mnt/nvme0       # Backup of kiwix wikipedia copy / survival local copy

# Databases to dump to a file first. The live Postgres files can be mid-write while they're copied;
# the dump is a consistent copy and is what you'd restore from.
host_backup_db_dumps:
  - name: gitea
    ct: 107                        # Proxmox container that runs it
    container: gitea-db            # Docker container inside it
    dir: /mnt/nvme1/db-dumps       # on the host, so it's inside the backup
    keep: 3                        # dumps kept on disk (PBS keeps the history)

host_backup_id: skynet             # shows in PBS as host/skynet
host_backup_time: "02:30"          # before the 03:30 Proxmox backups

# Health checks (playbooks/health-check.yml): small checks run every 5 minutes, each reporting to
# its own Uptime Kuma push monitor. Push URLs: health_check_push_urls.<name> in secrets.yml.
#   name     letters, digits and _ only (it becomes a shell variable name)
#   command  run as a list of words (no shell), with a 60 s time limit
#   expect   text that must appear in the command's output; the check also fails if it exits non-zero
#   problem  what the phone alert says (no paths or secrets: it goes through ntfy.sh)
health_checks:
  - name: plex_gpu
    command: [pct, exec, "103", --, nvidia-smi, -L]
    expect: Quadro P2200
    problem: Plex GPU unusable in CT 103
