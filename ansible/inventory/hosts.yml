---
# Every machine Ansible manages, sorted into groups. Playbooks target groups, not single machines.
# Hosts are patched in the order listed here (one at a time).
all:
  children:
    # Proxmox VE hosts. Patched only by a hand-started run (patch-hosts), never rebooted by CI.
    proxmox:
      hosts:
        skynet:
          ansible_host: 192.168.50.8
        little-skynet:
          ansible_host: 192.168.50.220

    # Proxmox Backup Server (Toshiba laptop). Same rules as the Proxmox hosts.
    pbs:
      hosts:
        proxmox-backup:
          ansible_host: 192.168.50.76

    # LXCs and VMs. Patched every week on a schedule (patch-guests).
    guests:
      children:
        skynet_guests:
          hosts:
            arr-stack:            # CT 100: *arr, audiobookshelf, qbittorrent
              ansible_host: 192.168.50.199
            foundry-dnd:          # CT 101 (the Cloudflare routes still point at the old .3)
              ansible_host: 192.168.50.159
            plex:                 # CT 103
              ansible_host: 192.168.50.88
            authentik:            # CT 108
              ansible_host: 192.168.50.151
            gitea-runner:         # Docker runner for lint + Renovate (safe to patch: Ansible runs elsewhere)
              ansible_host: 192.168.50.90
        little_skynet_guests:
          hosts:
            # pve_host / pve_vmid: where each LXC lives in Proxmox, so docker-engine.yml can snapshot it.
            file-browser:         # CT 100
              ansible_host: 192.168.50.246
              pve_host: little-skynet
              pve_vmid: 100
            portainer:            # CT 101: homepage, mealie, paperless, tautulli, kuma, vaultwarden
              ansible_host: 192.168.50.81
              pve_host: little-skynet
              pve_vmid: 101
            cloudflared:          # CT 102
              ansible_host: 192.168.50.27
              pve_host: little-skynet
              pve_vmid: 102
            immich:               # VM 103 (Ubuntu)
              ansible_host: 192.168.50.106
        # Gitea goes last: while it restarts, the runner can't report job progress.
        gitea_host:
          hosts:
            gitea:                # CT 107
              ansible_host: 192.168.50.124

    # Raspberry Pis. Patched weekly with the guests.
    pis:
      hosts:
        pihole:
          ansible_host: 192.168.50.2
        pi4-backup:
          ansible_host: 192.168.50.75

    # Hosts still on Debian's old docker.io package (Docker 20.10, no compose plugin).
    # docker-engine.yml moves them to Docker CE, one host per run. Remove a host from this list
    # once it's done. Empty since 2026-11-17 (file-browser, cloudflared, portainer all moved);
    # kept so the playbook still has a target if an old host turns up.
    old_docker:
      hosts: {}

    # Portainer: one server, and a standard agent on every other host that should show up in it.
    # portainer.yml manages both, from one version (group_vars/portainer_hosts.yml).
    # Agents are rolled out in the order listed. portainer_retire names old config files that the
    # playbook renames to <name>.retired once the managed setup is running.
    portainer_hosts:
      children:
        portainer_server:
          hosts:
            portainer:
              portainer_retire: [/root/docker-compose.yml]
        portainer_agents:
          hosts:
            gitea-runner:
            cloudflared:
              portainer_retire: [/root/portainerAgentUpdate.sh]
            arr-stack:
              portainer_retire: [/root/portainer-compose.yaml]
            authentik:
            gitea:
              portainer_retire: [/mnt/nvme1/portainer/docker-compose.yaml]

    # The Ansible LXC itself (CT 110, the "control node"). It gets the same accounts and SSH
    # hardening as everything else (users.yml, harden-ssh.yml target "all"), but it is in no patch
    # group: patching it would kill the job doing the patching, so it installs its own security
    # updates (unattended-upgrades).
    control:
      hosts:
        ansible-lxc:
          ansible_host: 192.168.50.129
