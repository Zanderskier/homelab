# Runs on every PR (including Renovate's) and every push to main.
# Branch protection on main requires this to pass before a PR can merge.
name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install docker compose
        env:
          # renovate: datasource=github-releases depName=docker/compose
          COMPOSE_VERSION: v5.7.1
        run: |
          curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Validate every compose file
        run: |
          status=0
          for f in $(find stacks -name compose.yaml | sort); do
            # Stacks like Immich read a .env that only exists on the server; give CI an empty one.
            if grep -qF -- '- .env' "$f"; then touch "$(dirname "$f")/.env"; fi
            # Secrets only exist in Portainer. Give every ${VAR} a dummy value so required (:?) vars pass.
            vars=$(grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*' "$f" | cut -c3- | sort -u)
            # Path-like variables need a path, or compose reads them as a named volume.
            dummies=$(for v in $vars; do case "$v" in *LOCATION|*PATH|*DIR) printf '%s=./ci ' "$v" ;; *) printf '%s=ci ' "$v" ;; esac; done)
            if env $dummies docker-compose -f "$f" config -q; then
              echo "ok    $f"
            else
              echo "FAIL  $f"; status=1
            fi
          done
          exit $status

      - name: Every image pinned to a version
        run: |
          if grep -rnE '^\s*image:\s*\S+:(latest|release)\s*$|^\s*image:\s*[^:@[:space:]]+\s*$' stacks; then
            echo "::error::Pin these images to a version tag so Renovate can track them."
            exit 1
          fi

      - name: No secrets committed
        run: |
          # Cloudflare tunnel tokens / JWTs, private keys, env files
          if grep -rnE 'eyJ[A-Za-z0-9_-]{40,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' --exclude-dir=.git . ; then
            echo "::error::Possible secret committed."; exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.env|stack\.env)$'; then
            echo "::error::Env file committed."; exit 1
          fi

  # Not part of the required "lint / compose*" check, so a style warning here never blocks a merge.
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        env:
          # renovate: datasource=github-releases depName=astral-sh/uv
          UV_VERSION: 0.13.8
        run: |
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin
          uv venv --python 3.13 /opt/ansible
          uv pip install --python /opt/ansible -r ansible/requirements.txt
          echo "/opt/ansible/bin" >> "$GITHUB_PATH"

      - name: Syntax check every playbook
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          for p in playbooks/*.yml; do ansible-playbook --syntax-check "$p"; done

      - name: ansible-lint (best practices)
        working-directory: ansible
        run: ansible-lint playbooks/

      - name: Bootstrap scripts are valid bash
        run: for s in ansible/bootstrap/*.sh; do bash -n "$s" && echo "ok  $s"; done
