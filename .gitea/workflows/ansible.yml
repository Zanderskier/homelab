# Runs Ansible on the Ansible LXC (skynet), via the runner registered there with the "ansible" label.
# Steps run directly on that LXC (host mode), where the Ansible SSH key lives. The key is never
# stored in Gitea.
#   - Every Sunday 04:30 Pacific (05:30 in summer): patch-guests (OS updates for LXCs, VMs, Pis; no reboots)
#   - When an Immich change reaches main (e.g. a merged Renovate PR): the immich playbook
#   - Any time, by hand: Actions tab > ansible > Run workflow > pick a playbook
name: ansible

on:
  push:
    branches: [main]
    paths:
      - stacks/little-skynet/immich/**
      - ansible/inventory/host_vars/immich.yml
      - ansible/playbooks/immich.yml
  schedule:
    # Cron is UTC. 12:30 UTC = 04:30 PST / 05:30 PDT: always after the nightly PBS backups
    # (skynet 03:00, little-skynet 03:30), so every patch run has a fresh backup to roll back to.
    - cron: "30 12 * * 0"
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook to run
        type: choice
        options: [ping, patch-guests, patch-hosts, users, harden-ssh, immich]
        default: ping
      limit:
        description: "Only these hosts or groups (optional, e.g. pis or plex,gitea)"
        type: string
        required: false
      allow_reboot:
        description: Reboot guests that need it (Proxmox hosts are never rebooted)
        type: boolean
        default: false
      check_mode:
        description: "Dry run: show what would change, change nothing"
        type: boolean
        default: false

jobs:
  ansible:
    runs-on: ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        env:
          # renovate: datasource=github-releases depName=astral-sh/uv
          UV_VERSION: 0.13.8
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          # A venv in the runner's home: reused between runs, so this is quick after the first time.
          uv venv --allow-existing --python 3.13 "$HOME/.venvs/ansible"
          uv pip install --python "$HOME/.venvs/ansible" -r ansible/requirements.txt
          echo "$HOME/.venvs/ansible/bin" >> "$GITHUB_PATH"

      - name: Install collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run playbook
        working-directory: ansible
        env:
          EVENT: ${{ gitea.event_name }}
          # Inputs are empty on scheduled and push runs, so these defaults apply then.
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          LIMIT: ${{ inputs.limit }}
          ALLOW_REBOOT: ${{ inputs.allow_reboot || false }}
          CHECK_MODE: ${{ inputs.check_mode || false }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          case "$EVENT" in
            push)     PLAYBOOK=immich ;;          # only Immich paths trigger a push run
            schedule) PLAYBOOK=patch-guests ;;
            *)        PLAYBOOK="$INPUT_PLAYBOOK" ;;
          esac
          case "$PLAYBOOK" in ping|patch-guests|patch-hosts|users|harden-ssh|immich) ;; *) echo "unknown playbook '$PLAYBOOK'"; exit 1 ;; esac
          args=(-e "allow_reboot=$ALLOW_REBOOT")
          # Secrets that must never be in Git (e.g. alex's sudo password hash) live only on this LXC.
          [ -f /ansible_config/secrets.yml ] && args+=(-e @/ansible_config/secrets.yml)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ "$CHECK_MODE" = "true" ] && args+=(--check --diff)
          echo "Running playbooks/$PLAYBOOK.yml ${args[*]}"
          ansible-playbook "playbooks/$PLAYBOOK.yml" "${args[@]}"
