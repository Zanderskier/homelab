# Runs Ansible on the Ansible LXC (skynet), via the runner registered there with the "ansible" label.
# Steps run directly on that LXC (host mode), where the Ansible SSH key lives. The key is never
# stored in Gitea.
#
# This workflow: the weekly patch run, and any playbook by hand.
#   - Every Sunday 04:30 Pacific (05:30 in summer): patch-guests (OS updates for LXCs, VMs, Pis; no reboots)
#   - Any time: Actions tab > ansible > Run workflow > pick a playbook. Dry run is ticked by default.
# Deploys that run by themselves when an update is merged have their own workflows:
#   deploy-immich.yml, deploy-portainer.yml
name: ansible
# The name each run gets in the Actions list, e.g. "portainer - ...  [DRY RUN]".
run-name: >-
  ${{ inputs.playbook || 'patch-guests - weekly schedule' }}${{
  (inputs.check_mode == true || inputs.check_mode == 'true') && '  [DRY RUN]'
  || (inputs.playbook && '  [REAL RUN]' || '') }}

on:
  schedule:
    # Cron is UTC. 12:30 UTC = 04:30 PST / 05:30 PDT: always after the nightly PBS backups
    # (skynet 03:00, little-skynet 03:30), so every patch run has a fresh backup to roll back to.
    - cron: "30 12 * * 0"
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook to run (the first word is the playbook)
        type: choice
        options:
          - "ping - safe test, changes nothing"
          - "patch-guests - OS updates on LXCs, VMs, Pis (runs every Sunday by itself)"
          - "patch-hosts - Proxmox VE + PBS updates, never reboots"
          - "immich - deploy Immich (runs by itself when an update is merged)"
          - "portainer - Portainer server + agents (runs by itself when an update is merged)"
          - "docker-cleanup - unused images, orphaned Portainer stacks"
          - "portainer-discover - report only, changes nothing"
          - "users - admin + break-glass accounts (new machine only)"
          - "harden-ssh - keys-only SSH (new machine only)"
        default: "ping - safe test, changes nothing"
      check_mode:
        description: "Dry run: show what would change, change nothing (untick to make changes)"
        type: boolean
        default: true
      limit:
        description: "Only these hosts or groups (optional, e.g. pis or plex,gitea)"
        type: string
        required: false
      allow_reboot:
        description: Reboot guests that need it (patch-guests only; Proxmox hosts are never rebooted)
        type: boolean
        default: false
      extra_vars:
        description: "Extra variables (optional, key=value). Normally empty"
        type: string
        required: false

jobs:
  ansible:
    runs-on: ansible
    steps:
      - uses: actions/checkout@v7

      - uses: ./.gitea/actions/setup-ansible

      - name: Run playbook
        working-directory: ansible
        env:
          EVENT: ${{ gitea.event_name }}
          # Inputs are empty on the scheduled run, so these defaults apply then.
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          LIMIT: ${{ inputs.limit }}
          ALLOW_REBOOT: ${{ inputs.allow_reboot || false }}
          CHECK_MODE: ${{ inputs.check_mode || false }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          if [ "$EVENT" = "schedule" ]; then
            exec bash run-playbook.sh patch-guests "weekly schedule (Sunday, after the PBS backups)"
          fi
          exec bash run-playbook.sh "${INPUT_PLAYBOOK%% *}" "started by hand from the Actions tab"
